# fly.toml app configuration file generated for protegey-docs-dev on 2026-01-20T13:15:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'protegey-docs-dev'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  ignorefile = '../../.dockerignore'
  context = '../../'

[env]
  NODE_ENV = 'development'
  PORT = '3000'
  NUXT_PUBLIC_API_BASE = 'https://protegey-dev.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

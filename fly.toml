# fly.toml app configuration file for docs

app = "protegey-docs"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"
  ignorefile = "../../.dockerignore"
  context = "../../"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# fly.prod.toml - Production environment configuration for docs


app = 'protegey-docs'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'


[env]
  NODE_ENV = 'production'
  PORT = '3000'
  NUXT_PUBLIC_API_BASE = 'https://api.protegey.com'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

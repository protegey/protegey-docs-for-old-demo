# fly.prod.toml - Production environment configuration for docs
app = 'protegey-docs-prod'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  ignorefile = '../../.dockerignore'
  context = '../../'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  NUXT_PUBLIC_API_BASE = 'https://protegey-dev.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

[[vm]]
  memory = '1gb'
  cpus = 2
